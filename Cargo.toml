[package]
name = "ue-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "chrono", "bigdecimal"] }
clap = { version = "4.4", features = ["derive"] }
rand = "0.8"
chrono = "0.4"
futures = "0.3"